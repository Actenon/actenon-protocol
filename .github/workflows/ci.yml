name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  required-checks:
    # Branch protection and the publish workflows' release gate read
    # .github/required-checks.json. Every name in it must be produced by a job.
    name: Required-check names exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/release_gate.py validate
      - name: Release retry must preserve tagged source and required checks
        run: python -m unittest discover -s scripts/tests -v

  conformance:
    name: Conformance suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify YAML->JSON catalogue is in sync
        # Enforces that the pre-compiled JSON catalogue matches the YAML source.
        # This is what makes the "zero runtime dependencies" claim machine-verified:
        # the JSON ships in the wheel, the YAML is the human-editable source.
        run: python scripts/compile_yaml_to_json.py --check

      - name: Run conformance suite (161 vectors)
        run: python -m pytest conformance/python/ -v

  lint:
    name: Lint + format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.8' pyyaml

      # README-claim verification moved to verify-claims.yml so the badge
      # can link to a dedicated gate.

      - name: Lint with ruff
        run: ruff check python/ conformance/python/

      - name: Format check with ruff
        run: ruff format --check python/ conformance/python/

  typescript:
    name: TypeScript types check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install TS deps
        working-directory: typescript
        run: bun install

      - name: TypeScript typecheck
        working-directory: typescript
        run: bun run typecheck

      - name: Canonicalisation wire corpus
        working-directory: typescript
        run: bun run tests/conformance.ts

      - name: TS tests
        working-directory: typescript
        run: bun test

      - name: Set up Node.js (plain-Node import check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (tsc → dist/)
        working-directory: typescript
        run: bun run build

      - name: Smoke-test npm pack output under plain Node.js
        # The package used to ship only .ts source as main, which Node refuses
        # (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING).
        working-directory: typescript
        run: bash ../scripts/smoke-npm-pack.sh . @actenon/protocol-types canonicalizeJson canonicalizeBytes parseStrict CanonicalisationError RefusalCode refusalToDisclosedCode resolveAlias PROTOCOL_VERSION isValidIdentifier ExecutionMode ExecutionOutcome effectIdentity validateEffectEvidence EFFECT_PROFILE

      - name: Build runtime candidate for installed strict JSON parity
        working-directory: typescript-runtime
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify strict parsing and effect identities from installed npm tarballs
        run: bash scripts/smoke-strict-json-pack.sh

  typescript-runtime:
    name: TypeScript runtime (@actenon/protocol)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Set up Node.js (for npm pack)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: typescript-runtime
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: typescript-runtime
        run: bun run typecheck

      - name: Build (tsc → dist/)
        working-directory: typescript-runtime
        run: bun run build

      - name: Smoke-test dist/ under plain Node.js
        # Bun transpiles TS inside node_modules; Node does not. This catches
        # a dist/ that imports a TypeScript-source-only package at runtime.
        working-directory: typescript-runtime
        run: node tests/node-import.mjs

      - name: Run canonicalisation conformance suite
        working-directory: typescript-runtime
        run: bun run tests/conformance.ts

      - name: Verify package (npm pack dry-run)
        working-directory: typescript-runtime
        run: npm pack --dry-run

      - name: Smoke-test npm pack output under plain Node.js
        working-directory: typescript-runtime
        run: bash ../scripts/smoke-npm-pack.sh . @actenon/protocol canonicalize canonicalizeBytes canonicalizeJson parseStrict CanonicalisationError PROTOCOL_VERSION ACCEPTED_CANONICALISATION_PROFILES
