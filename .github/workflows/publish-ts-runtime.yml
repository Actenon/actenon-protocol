name: Publish @actenon/protocol to npm

# Publishes @actenon/protocol (the runtime package) from typescript-runtime/
# to the npm registry.
#
# Triggers on:
#   - Tag pushes matching ts-runtime-v* (e.g. ts-runtime-v1.0.0)
#   - Manual workflow_dispatch
#
# Uses npm provenance (GitHub OIDC → npm trust) instead of a long-lived
# npm token. This requires the @actenon/protocol package on npm to be
# configured to trust this GitHub repository's OIDC issuer.
#
# To configure provenance:
#   1. Go to https://www.npmjs.com/package/@actenon/protocol/access
#   2. Under "Provenance", enable "Require provenance"
#   3. Link the GitHub repository Actenon/actenon-protocol
#
# No NPM_TOKEN secret is needed — npm verifies the GitHub OIDC token
# directly.

on:
  push:
    tags:
      - "ts-runtime-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for npm provenance (OIDC)

jobs:
  release-gate:
    # Publish only the exact ts-runtime-v<version> tag, on a commit that is on main
    # and whose required checks (.github/required-checks.json "release") passed.
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit is on main and its required checks passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py gate --tag-prefix ts-runtime-v --version-from typescript-runtime/package.json

  verify:
    needs: release-gate
    name: Build + test @actenon/protocol
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Set up Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: typescript-runtime
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: typescript-runtime
        run: bun run typecheck

      - name: Build (tsc → dist/)
        working-directory: typescript-runtime
        run: bun run build

      - name: Smoke-test dist/ under plain Node.js
        # Bun transpiles TS inside node_modules; Node does not. This catches
        # a dist/ that imports a TypeScript-source-only package at runtime.
        working-directory: typescript-runtime
        run: node tests/node-import.mjs

      - name: Run conformance suite
        working-directory: typescript-runtime
        run: bun run tests/conformance.ts

      - name: Verify package contents (npm pack dry-run)
        working-directory: typescript-runtime
        run: npm pack --dry-run

      - name: Smoke-test npm pack output under plain Node.js
        working-directory: typescript-runtime
        run: bash ../scripts/smoke-npm-pack.sh . @actenon/protocol canonicalize canonicalizeBytes canonicalizeJson parseStrict CanonicalisationError PROTOCOL_VERSION ACCEPTED_CANONICALISATION_PROFILES

      - name: Pack the tarball that will be published
        working-directory: typescript-runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"

      - name: The exact tarball imports under plain Node.js
        run: bash scripts/smoke-npm-installed.sh "$(ls "$RUNNER_TEMP"/pkg/*.tgz)" @actenon/protocol canonicalize canonicalizeBytes canonicalizeJson parseStrict CanonicalisationError PROTOCOL_VERSION ACCEPTED_CANONICALISATION_PROFILES

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error

  publish:
    name: Publish to npm with provenance
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    if: startsWith(github.ref, 'refs/tags/ts-runtime-v')

    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: pkg

      - name: Publish the tested tarball (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ACTENON }}
        run: npm publish pkg/*.tgz --access public --provenance

      - name: Install from the registry and import under plain Node.js
        run: |
          version="$(node -p "require('./typescript-runtime/package.json').version")"
          for _ in $(seq 1 30); do
            npm view "@actenon/protocol@${version}" version >/dev/null 2>&1 && break
            sleep 10
          done
          bash scripts/smoke-npm-installed.sh "@actenon/protocol@${version}" @actenon/protocol canonicalize canonicalizeBytes canonicalizeJson parseStrict CanonicalisationError PROTOCOL_VERSION ACCEPTED_CANONICALISATION_PROFILES
