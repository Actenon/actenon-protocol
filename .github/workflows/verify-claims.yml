name: Verify claims

# Machine-enforce every claim the README makes about the package itself.
# For a trust product, one falsified claim costs more than ten missing
# features. These checks previously lived inside ci.yml's lint job; they
# have their own workflow so the README badge can link to the gate.
#
# The daily schedule matters: the registry-install check depends on PyPI
# and npm state, which can change with no PR to catch it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

jobs:
  verify-claims:
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install check deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Verify zero runtime dependencies
        # Enforces that pyproject.toml declares `dependencies = []`. The
        # README's "Zero dependencies" badge is a claim about runtime deps;
        # this check makes the claim machine-verified rather than editorial.
        run: |
          python - <<'EOF'
          import tomllib, sys
          with open('pyproject.toml','rb') as f:
              data = tomllib.load(f)
          deps = data['project'].get('dependencies', [])
          if deps:
              print(f'FAIL: actenon-protocol must have zero runtime deps, found: {deps}', file=sys.stderr)
              sys.exit(1)
          print('OK: zero runtime dependencies')
          EOF

      - name: Verify YAML->JSON catalogue is in sync
        run: python scripts/compile_yaml_to_json.py --check

      - name: Verify conformance vector count matches the README
        # The README claims a specific number of hash-locked vectors. Count
        # the actual vector files rather than trusting the prose.
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          readme = pathlib.Path('README.md').read_text()
          m = re.search(r'ships \*\*(\d+) hash-locked test vectors\*\*', readme)
          if not m:
              print('FAIL: vector-count claim not found in README', file=sys.stderr)
              sys.exit(1)
          claimed = int(m.group(1))
          actual = len(list(pathlib.Path('conformance/vectors').rglob('*.json')))
          if claimed != actual:
              print(f'FAIL: README claims {claimed} vectors, found {actual} on disk', file=sys.stderr)
              sys.exit(1)
          print(f'OK: README vector count ({claimed}) matches conformance/vectors/ ({actual})')
          EOF

      - name: Verify conformance vectors match their hash lock
        # "Hash-locked" means every vector's SHA-256 is pinned in
        # conformance/vectors.sha256: a changed, deleted or unlisted vector
        # fails here. Only new vectors may be added to the lock.
        run: python scripts/check_vector_lock.py

      - name: Check generated Python badge
        run: python scripts/sync_badges.py --check

      - name: Check README version badge matches pyproject
        # The root-of-trust repo must never have a stale version badge.
        # This catches the drift the external review found (README said
        # v1.1.0 while pyproject was at v1.3.0). Checks the badge line
        # and the "Actenon-compatible" mark, not every version mention
        # (backward-compat references to v1.0.0 are legitimate).
        run: |
          python - <<'EOF'
          import pathlib, re, sys, tomllib
          with open('pyproject.toml','rb') as f:
              pyproject = tomllib.load(f)
          pyproject_version = pyproject['project']['version']
          readme = pathlib.Path('README.md').read_text()
          problems = []
          # Check the Version badge.
          badge_match = re.search(r'!\[Version: v(\d+\.\d+\.\d+)\]', readme)
          if badge_match and badge_match.group(1) != pyproject_version:
              problems.append(f'badge says v{badge_match.group(1)}, pyproject is {pyproject_version}')
          # Check the "Actenon-compatible vX.Y.Z" mark.
          compat_matches = re.findall(r'Actenon-compatible v(\d+\.\d+\.\d+)', readme)
          for v in compat_matches:
              if v != pyproject_version:
                  problems.append(f'"Actenon-compatible v{v}" mark is stale; pyproject is {pyproject_version}')
          # Check the "Python reference" status line.
          ref_match = re.search(r'Python reference.*?Stable v(\d+\.\d+\.\d+) on PyPI', readme)
          if ref_match and ref_match.group(1) != pyproject_version:
              problems.append(f'Python reference status says v{ref_match.group(1)}, pyproject is {pyproject_version}')
          if problems:
              for p in problems: print(f'FAIL: {p}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: README version badge, compatibility mark, and Python reference status all match pyproject ({pyproject_version})')
          EOF

      - name: Check README registry installs
        run: python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        # On protocol's own CI we install from the local checkout so the
        # renderer being tested is the one on this branch. Consumer repos
        # (kernel, permit, scan) install from PyPI instead, which works
        # once a release with the renderer is published.
        run: |
          pip install --quiet .
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-protocol
