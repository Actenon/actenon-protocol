name: Publish TypeScript types to npm

# Publishes @actenon/protocol-types from typescript/ to the npm registry.
#
# Triggers on:
#   - Tag pushes matching ts-types-v* (e.g. ts-types-v1.0.0)
#   - Manual workflow_dispatch
#
# Uses the org-wide NPM secret (automation token with publish rights on
# the @actenon scope). The token must be registered as an org secret at
# github.com/organizations/Actenon/settings/secrets/actions named `NPM`.

on:
  push:
    tags:
      - "ts-types-v*"
  workflow_dispatch:

jobs:
  release-gate:
    # Publish only the exact ts-types-v<version> tag, on a commit that is on main
    # and whose required checks (.github/required-checks.json "release") passed.
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit is on main and its required checks passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py gate --tag-prefix ts-types-v --version-from typescript/package.json

  verify:
    needs: release-gate
    name: Build + test @actenon/protocol-types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        working-directory: typescript
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: typescript
        run: bun run typecheck

      - name: Run tests
        working-directory: typescript
        run: bun test

      - name: Build (tsc → dist/)
        working-directory: typescript
        run: bun run build

      - name: Verify package contents (npm pack dry-run)
        working-directory: typescript
        run: npm pack --dry-run

      - name: Smoke-test npm pack output under plain Node.js
        working-directory: typescript
        run: bash ../scripts/smoke-npm-pack.sh . @actenon/protocol-types canonicalizeJson canonicalizeBytes CanonicalisationError RefusalCode refusalToDisclosedCode resolveAlias PROTOCOL_VERSION isValidIdentifier ExecutionMode ExecutionOutcome

      - name: Pack the tarball that will be published
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"

      - name: The exact tarball imports under plain Node.js
        run: bash scripts/smoke-npm-installed.sh "$(ls "$RUNNER_TEMP"/pkg/*.tgz)" @actenon/protocol-types canonicalizeJson canonicalizeBytes CanonicalisationError RefusalCode refusalToDisclosedCode resolveAlias PROTOCOL_VERSION isValidIdentifier ExecutionMode ExecutionOutcome

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance
    environment: npm
    if: startsWith(github.ref, 'refs/tags/ts-types-v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: pkg

      - name: Publish the tested tarball (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ACTENON }}
        run: npm publish pkg/*.tgz --access public --provenance

      - name: Install from the registry and import under plain Node.js
        run: |
          version="$(node -p "require('./typescript/package.json').version")"
          for _ in $(seq 1 30); do
            npm view "@actenon/protocol-types@${version}" version >/dev/null 2>&1 && break
            sleep 10
          done
          bash scripts/smoke-npm-installed.sh "@actenon/protocol-types@${version}" @actenon/protocol-types canonicalizeJson canonicalizeBytes CanonicalisationError RefusalCode refusalToDisclosedCode resolveAlias PROTOCOL_VERSION isValidIdentifier ExecutionMode ExecutionOutcome
